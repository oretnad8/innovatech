name: Deploy to AWS EC2

on:
  push:
    branches: [ "deploy" ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ec2-user # Ajustado para Amazon Linux
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/app"

      - name: Execute Manual Docker Build on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            docker-compose down || true
            docker build -t app-backend-ventas ./back-Ventas_SpringBoot/Springboot-API-REST
            docker build -t app-backend-despachos ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
            docker build -t app-frontend --build-arg VITE_API_VENTAS=http://54.198.73.188:8081 --build-arg VITE_API_DESPACHOS=http://54.198.73.188:8080 ./front_despacho
            docker-compose up -d
