name: Deploy to Multi-Tier AWS Architecture

on:
  push:
    branches: [ "deploy" ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ==========================================================
      # LOGUEO NATIVO SIN DEPENDER DE ACCIONES EXTERNAS (EVITA ERRORES DE DOWNLOAD)
      # ==========================================================
      - name: Login to Docker Hub (Native)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # ==========================================================
      # CONSTRUCCIÓN Y EMPAQUETADO EN GITHUB ACTIONS
      # ==========================================================
      - name: Build and Push Images to Docker Hub
        run: |
          # 1. Compilar y subir Backend Ventas
          docker build -t oretnad8/innovatech-backend-ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push oretnad8/innovatech-backend-ventas:latest
          
          # 2. Compilar y subir Backend Despachos
          docker build -t oretnad8/innovatech-backend-despacho:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push oretnad8/innovatech-backend-despacho:latest
          
          # 3. Compilar y subir Frontend inyectando la IP PÚBLICA del servidor de Backends
          docker build -t oretnad8/innovatech-frontend:latest --build-arg VITE_API_VENTAS=http://${{ secrets.AWS_HOST_BACK }}:8081 --build-arg VITE_API_DESPACHOS=http://${{ secrets.AWS_HOST_BACK }}:8080 ./front_despacho
          docker push oretnad8/innovatech-frontend:latest

      # ==========================================================
      # DESPLIEGUE CAPA DE DATOS (DATABASE)
      # ==========================================================
      - name: Copy Compose to DB Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST_DB }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "docker-compose-db.yml"
          target: "/home/ec2-user/app"

      - name: Deploy Database Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST_DB }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app
            if [ -f "docker-compose-db.yml" ]; then cp docker-compose-db.yml docker-compose.yml; fi
            docker-compose down || docker compose down || true
            docker-compose up -d || docker compose up -d

      # ==========================================================
      # DESPLIEGUE CAPA DE LÓGICA (BACKENDS)
      # ==========================================================
      - name: Copy Compose to Backends Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST_BACK }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "docker-compose-backends.yml"
          target: "/home/ec2-user/app"

      - name: Deploy Backends Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST_BACK }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app
            if [ -f "docker-compose-backends.yml" ]; then cp docker-compose-backends.yml docker-compose.yml; fi
            docker-compose down || docker compose down || true
            docker system prune -a -f
            docker-compose pull || docker compose pull
            docker-compose up -d || docker compose up -d

      # ==========================================================
      # DESPLIEGUE CAPA DE PRESENTACIÓN (FRONTEND)
      # ==========================================================
      - name: Copy Compose to Frontend Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST_FRONT }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "docker-compose-frontend.yml"
          target: "/home/ec2-user/app"

      - name: Deploy Frontend Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST_FRONT }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app
            if [ -f "docker-compose-frontend.yml" ]; then cp docker-compose-frontend.yml docker-compose.yml; fi
            docker-compose down || docker compose down || true
            docker system prune -a -f
            docker-compose pull || docker compose pull
            docker-compose up -d || docker compose up -d