name: Deploy to Multi-Tier AWS Architecture

on:
  push:
    branches: [ "deploy" ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ==========================================================
      # LOGUEO NATIVO DE DOCKER HUB (Sin plugins externos)
      # ==========================================================
      - name: Login to Docker Hub (Native)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # ==========================================================
      # CONSTRUCCIÓN Y EMPAQUETADO EN GITHUB ACTIONS
      # ==========================================================
      - name: Build and Push Images to Docker Hub
        run: |
          # 1. Compilar y subir Backend Ventas
          docker build -t oretnad8/innovatech-backend-ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push oretnad8/innovatech-backend-ventas:latest
          
          # 2. Compilar y subir Backend Despachos
          docker build -t oretnad8/innovatech-backend-despacho:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push oretnad8/innovatech-backend-despacho:latest
          
          # 3. Compilar y subir Frontend inyectando la IP PÚBLICA del servidor de Backends
          docker build -t oretnad8/innovatech-frontend:latest --build-arg VITE_API_VENTAS=http://${{ secrets.AWS_HOST_BACK }}:8081 --build-arg VITE_API_DESPACHOS=http://${{ secrets.AWS_HOST_BACK }}:8080 ./front_despacho
          docker push oretnad8/innovatech-frontend:latest

      # ==========================================================
      # CONFIGURAR LLAVE SSH NATIVA EN EL RUNNER DE GITHUB
      # ==========================================================
      - name: Setup SSH Native Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Desactivar la verificación estricta de hosts para que no pida confirmar "yes/no"
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      # ==========================================================
      # DESPLIEGUE CAPA DE DATOS (DATABASE) - COMANDOS NATIVOS
      # ==========================================================
      - name: Deploy Database Server (Native)
        run: |
          # Enviar archivo usando SCP nativo de Linux
          scp docker-compose-db.yml ec2-user@${{ secrets.AWS_HOST_DB }}:/home/ec2-user/app/docker-compose-db.yml
          
          # Ejecutar comandos remotos mediante SSH nativo
          ssh ec2-user@${{ secrets.AWS_HOST_DB }} << 'EOF'
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app
            cp docker-compose-db.yml docker-compose.yml 2>/dev/null || true
            docker-compose down || docker compose down || true
            docker-compose up -d || docker compose up -d
          EOF

      # ==========================================================
      # DESPLIEGUE CAPA DE LÓGICA (BACKENDS) - COMANDOS NATIVOS
      # ==========================================================
      - name: Deploy Backends Server (Native)
        run: |
          # Enviar archivo
          scp docker-compose-backends.yml ec2-user@${{ secrets.AWS_HOST_BACK }}:/home/ec2-user/app/docker-compose-backends.yml
          
          # Ejecutar comandos
          ssh ec2-user@${{ secrets.AWS_HOST_BACK }} << 'EOF'
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app
            cp docker-compose-backends.yml docker-compose.yml 2>/dev/null || true
            docker-compose down || docker compose down || true
            docker system prune -a -f
            docker-compose pull || docker compose pull
            docker-compose up -d || docker compose up -d
          EOF

      # ==========================================================
      # DESPLIEGUE CAPA DE PRESENTACIÓN (FRONTEND) - COMANDOS NATIVOS
      # ==========================================================
      - name: Deploy Frontend Server (Native)
        run: |
          # Enviar archivo
          scp docker-compose-frontend.yml ec2-user@${{ secrets.AWS_HOST_FRONT }}:/home/ec2-user/app/docker-compose-frontend.yml
          
          # Ejecutar comandos
          ssh ec2-user@${{ secrets.AWS_HOST_FRONT }} << 'EOF'
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app
            cp docker-compose-frontend.yml docker-compose.yml 2>/dev/null || true
            docker-compose down || docker compose down || true
            docker system prune -a -f
            docker-compose pull || docker compose pull
            docker-compose up -d || docker compose up -d
          EOF