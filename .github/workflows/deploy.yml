name: Deploy to AWS EC2

on:
  push:
    branches: [ "deploy" ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ec2-user # Ajustado para Amazon Linux
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/app"

      - name: Execute Docker Build and Compose on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            # Detener lo anterior
            docker-compose down
            
            # Construir imágenes manualmente para evitar el error de Buildx
            docker build -t app-backend-ventas ./back-Ventas_SpringBoot/Springboot-API-REST
            docker build -t app-frontend ./front_despacho
            
            # Levantar usando las imágenes ya construidas
            docker-compose up -d