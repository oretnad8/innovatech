name: Deploy to AWS EC2

on:
  push:
    branches: [ "deploy" ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Images to Docker Hub
        run: |
          # 1. Compilar y subir Backend Ventas
          docker build -t oretnad8/innovatech-backend-ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push oretnad8/innovatech-backend-ventas:latest
          
          # 2. Compilar y subir Backend Despachos
          docker build -t oretnad8/innovatech-backend-despacho:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push oretnad8/innovatech-backend-despacho:latest
          
          # 3. Compilar y subir Frontend con la IP actual integrada
          docker build -t oretnad8/innovatech-frontend:latest --build-arg VITE_API_VENTAS=http://54.198.73.188:8081 --build-arg VITE_API_DESPACHOS=http://54.198.73.188:8080 ./front_despacho
          docker push oretnad8/innovatech-frontend:latest

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/app"
          
      - name: Execute Manual Docker Build on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            
            # 1. Detener el entorno colgado y liberar espacio de inmediato
            docker-compose down || true
            docker system prune -a -f
            docker volume prune -f
            
            # 2. Descargar y levantar la Base de Datos primero
            docker-compose pull db-ventas
            docker-compose up -d db-ventas
            docker system prune -f # Limpiar el almacenamiento temporal usado en la descarga
            
            # 3. Descargar y levantar Backend Ventas
            docker-compose pull backend-ventas
            docker-compose up -d backend-ventas
            docker system prune -f
            
            # 4. Descargar y levantar Backend Despachos
            docker-compose pull backend-despachos
            docker-compose up -d backend-despachos
            docker system prune -f
            
            # 5. Descargar y levantar el Frontend al final
            docker-compose pull frontend
            docker-compose up -d frontend
            
            echo "=== DESPLIEGUE SECUENCIAL COMPLETADO CON ÉXITO ==="