version: '3.8'

services:
  backend-ventas:
    image: oretnad8/innovatech-backend-ventas:latest
    container_name: backend-ventas
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://44.213.90.125:3306/ventas_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SERVER_PORT=8081
      - JAVA_OPTS=-Xmx200m
    networks:
      - devops-net
    restart: always

  backend-despachos:
    image: oretnad8/innovatech-backend-despacho:latest
    container_name: backend-despachos
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://44.213.90.125:3306/ventas_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SERVER_PORT=8080
      - JAVA_OPTS=-Xmx200m
    networks:
      - devops-net
    restart: always

networks:
  devops-net:
    driver: bridge
